<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launch Vehicle Comparison | Space Program</title><meta name="description" content="Compare orbital launch vehicles with performance radar and specifications."><link rel="canonical" href="https://afroconstellation.com/compare.html"><link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

</head><body><a href="#main-content" class="sr-only">Skip to main content</a><header class="header"><div class="container"><a class="logo" href="/">🚀 SPACE PROGRAM <span class="logo-telemetry">COMPARE</span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span><span></span><span></span></button><nav aria-label="Main navigation"><ul class="nav-menu"><li><a class="nav-link" href="/">Home</a></li><li><a class="nav-link" href="launches.html">Launches</a></li><li><a class="nav-link" href="statistics.html">Statistics</a></li><li><a class="nav-link active" href="compare.html">Compare</a></li><li><a class="nav-link" href="news.html">News</a></li></ul></nav></div></header><main id="main-content" class="pt-header"><section class="section"><div class="container"><div class="section-header"><h1><span class="text-gradient">VEHICLE COMPARISON</span></h1><p>Side-by-side orbital launcher specifications and normalized performance profiles.</p></div><div class="grid grid-2"><label class="vehicle-compare-field">First vehicle <select id="vehicle-a"></select></label><label class="vehicle-compare-field">Second vehicle <select id="vehicle-b"></select></label></div><div class="grid grid-2" style="margin-top:2rem"><article class="card"><h2>Performance radar</h2><canvas id="radar" aria-label="Performance radar chart"></canvas></article><article class="card"><h2>Specifications</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th scope="col">Metric</th><th id="head-a" scope="col"></th><th id="head-b" scope="col"></th></tr></thead><tbody id="specs"></tbody></table></div></article></div></div></section></main><footer class="footer"><div class="container"><div class="footer-bottom"><p> © <span id="current-year">2026</span> Léonel Sandjong. MIT License.</p></div></div></footer><script src="js/api.js?v=5"></script><script src="js/app.js?v=5"></script><script>const vehicles=spaceAPI.getVehicles(),a=document.getElementById('vehicle-a'),b=document.getElementById('vehicle-b'),body=document.getElementById('specs');let chart;function populate(select,value){vehicles.forEach(vehicle=>{const option=document.createElement('option');option.value=vehicle.id;option.textContent=vehicle.name;option.selected=vehicle.id===value;select.appendChild(option)})}function row(label,left,right){const tr=document.createElement('tr');[label,left,right].forEach((value,index)=>{const cell=document.createElement(index?'td':'th');if(!index)cell.scope='row';cell.style.padding='.6rem';cell.style.borderBottom='1px solid var(--border-subtle)';cell.textContent=String(value);tr.appendChild(cell)});body.appendChild(tr)}function update(){const one=vehicles.find(v=>v.id===a.value),two=vehicles.find(v=>v.id===b.value);document.getElementById('head-a').textContent=one.name;document.getElementById('head-b').textContent=two.name;body.replaceChildren();[['Provider',one.provider,two.provider],['Status',one.status,two.status],['LEO payload',one.payloadLEO?`${(one.payloadLEO/1000).toFixed(1)} t`:'N/A',two.payloadLEO?`${(two.payloadLEO/1000).toFixed(1)} t`:'N/A'],['GTO payload',one.payloadGTO?`${(one.payloadGTO/1000).toFixed(1)} t`:'N/A',two.payloadGTO?`${(two.payloadGTO/1000).toFixed(1)} t`:'N/A'],['Height',`${one.height} m`,`${two.height} m`],['Thrust',`${one.thrust.toLocaleString()} kN`,`${two.thrust.toLocaleString()} kN`],['Reusable',one.reusable?'Yes':'No',two.reusable?'Yes':'No'],['Success rate',`${one.successRate}%`,`${two.successRate}%`],['Launch cost',spaceAPI.formatCurrency(one.costPerLaunch),spaceAPI.formatCurrency(two.costPerLaunch)]].forEach(values=>row(...values));if(!window.Chart)return;const normal=(value,max)=>Math.min(100,Math.round(value/max*100));const data={labels:['LEO','GTO','Thrust','Height','Mass'],datasets:[{label:one.name,data:[normal(one.payloadLEO||0,150000),normal(one.payloadGTO||0,100000),normal(one.thrust,74500),normal(one.height,121),normal(one.mass,5000000)],borderColor:'#22d3ee',backgroundColor:'rgba(34,211,238,.2)'},{label:two.name,data:[normal(two.payloadLEO||0,150000),normal(two.payloadGTO||0,100000),normal(two.thrust,74500),normal(two.height,121),normal(two.mass,5000000)],borderColor:'#a855f7',backgroundColor:'rgba(168,85,247,.2)'}]};if(chart)chart.destroy();chart=new Chart(document.getElementById('radar'),{type:'radar',data,options:{responsive:true,scales:{r:{beginAtZero:true,max:100,ticks:{display:false},pointLabels:{color:'#94a3b8'},grid:{color:'rgba(255,255,255,.08)'},angleLines:{color:'rgba(255,255,255,.08)'}}},plugins:{legend:{labels:{color:'#94a3b8'}}}}})}populate(a,'falcon9');populate(b,'starship');a.addEventListener('change',update);b.addEventListener('change',update);update();</script></body></html>
