<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital Launch Manifest | Space Program</title><meta name="description" content="Live orbital launch manifest with searchable upcoming and completed missions."><link rel="canonical" href="https://leosand.github.io/Space_program/launches.html"><link href="css/styles.css" rel="stylesheet"></head><body><a href="#main-content" class="sr-only">Skip to main content</a><header class="header"><div class="container"><a class="logo" href="index.html">🚀 SPACE PROGRAM <span class="logo-telemetry">LAUNCHES</span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span><span></span><span></span></button><nav aria-label="Main navigation"><ul class="nav-menu"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link active" href="launches.html">Launches</a></li><li><a class="nav-link" href="statistics.html">Statistics</a></li><li><a class="nav-link" href="compare.html">Compare</a></li><li><a class="nav-link" href="news.html">News</a></li></ul></nav></div></header><main id="main-content" class="pt-header"><section class="section"><div class="container"><div class="section-header"><h1><span class="text-gradient">ORBITAL LAUNCH MANIFEST</span></h1><p>Live Launch Library 2 telemetry with transparent offline archive fallbacks.</p></div><div class="vehicle-selector" role="tablist" aria-label="Launch timeline"><button class="vehicle-btn selected" data-tab="upcoming" role="tab" aria-selected="true">Upcoming</button><button class="vehicle-btn" data-tab="completed" role="tab" aria-selected="false">Completed</button></div><div class="vehicle-selector" role="group" aria-label="Provider filter" style="margin-top:1rem"><button class="vehicle-btn selected" data-filter="all">All providers</button><button class="vehicle-btn" data-filter="SpaceX">SpaceX</button><button class="vehicle-btn" data-filter="CASC">CASC</button><button class="vehicle-btn" data-filter="Rocket Lab">Rocket Lab</button><button class="vehicle-btn" data-filter="ULA">ULA</button><button class="vehicle-btn" data-filter="Arianespace">Arianespace</button></div><label for="launch-search" class="sr-only">Search launches</label><input id="launch-search" type="search" placeholder="Search missions, rockets, locations…" style="width:100%;margin:1rem 0;padding:.75rem 1rem;border-radius:var(--radius-md);border:1px solid var(--border-subtle);background:rgba(255,255,255,.03);color:var(--text-primary)"><div id="launches-container" class="grid grid-3" role="feed"><div class="loading"><div class="loading-spinner"></div><p>Syncing orbital telemetry…</p></div></div></div></section></main><footer class="footer"><div class="container"><div class="footer-bottom"><p> © <span id="current-year">2026</span> Léonel Sandjong. MIT License.</p></div></div></footer><script src="js/api.js"></script><script src="js/app.js"></script><script>let launches={upcoming:[],completed:[]},tab='upcoming',filter='all',query='';const container=document.getElementById('launches-container');function message(text){container.replaceChildren();const p=document.createElement('p');p.className='text-muted';p.style.gridColumn='1/-1';p.style.textAlign='center';p.textContent=text;container.appendChild(p)}function render(){const q=query.toLowerCase();const rows=(launches[tab]||[]).filter(item=>(filter==='all'||(item.provider||'').includes(filter))&&(!q||[item.name,item.rocket,item.location,item.mission].some(v=>(v||'').toLowerCase().includes(q))));container.replaceChildren();if(!rows.length){message('No launches match the current filters.');return}rows.forEach(item=>container.appendChild(renderLaunchCardSafe(item)))}async function load(){try{const [upcoming,completed]=await Promise.all([spaceAPI.getUpcomingLaunches(50),spaceAPI.getPastLaunches(100)]);launches={upcoming,completed};render()}catch(error){console.error(error);message('Unable to synchronize launch telemetry.')}}document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(item=>{item.classList.remove('selected');item.setAttribute('aria-selected','false')});button.classList.add('selected');button.setAttribute('aria-selected','true');tab=button.dataset.tab;render()}));document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');filter=button.dataset.filter;render()}));document.getElementById('launch-search').addEventListener('input',event=>{query=event.target.value;render()});load();</script></body></html>
