</head><body><a href="#main-content" class="sr-only">Skip to main content</a><header class="header"><div class="container"><a class="logo" href="/">🚀 SPACE PROGRAM</a><nav aria-label="Main navigation"><ul class="nav-menu"><li><a class="nav-link" href="/">Home</a></li><li><a class="nav-link" href="launches.html">Launches</a></li><li><a class="nav-link" href="statistics.html">Statistics</a></li><li><a class="nav-link" href="bookmarks.html">Bookmarks</a></li><li><a class="nav-link" href="compare.html">Compare</a></li><li><a class="nav-link" href="news.html">News</a></li></ul></nav></div></header><main id="main-content" class="pt-header"><section class="section"><div class="container"><div class="section-header"><h1><span class="text-gradient">BOOKMARKED LAUNCHES</span></h1><p>Your saved orbital missions.</p></div><div id="bookmarks-container" class="grid grid-3"><div class="loading"><div class="loading-spinner"></div><p>Loading bookmarks…</p></div></div></div></section></main><footer class="footer"><div class="container"><div class="footer-bottom"><p> © <span id="current-year">2026</span> Léonel Sandjong. MIT License.</p></div></div></footer><script src="js/api.js?v=4"></script><script src="js/app.js?v=4"></script><script src="js/bookmarks.js?v=4"></script><script>async function load(){const container=document.getElementById('bookmarks-container');const ids=Bookmarks.get();if(!ids.length){container.innerHTML='<p class="text-muted" style="grid-column:1/-1;text-align:center">No bookmarks yet. Click ☆ on launches to save them.</p>';return}const all=[...(await spaceAPI.getUpcomingLaunches(200)),...(await spaceAPI.getPastLaunches(200))];const saved=all.filter(l=>ids.includes(l.id));if(!saved.length){container.innerHTML='<p class="text-muted" style="grid-column:1/-1;text-align:center">Bookmarked launches not found in current manifest.</p>';return}container.replaceChildren(...saved.map(l=>renderLaunchCardSafe(l)))}load().catch(console.error);</script></body></html>
