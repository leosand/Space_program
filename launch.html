<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launch Details | Space Program</title><meta name="description" content="Detailed mission information and telemetry."><link rel="canonical" href="https://leosand.github.io/Space_program/launch.html"><link href="css/styles.css" rel="stylesheet"></head><body><a href="#main-content" class="sr-only">Skip to main content</a><header class="header"><div class="container"><a class="logo" href="index.html">🚀 SPACE PROGRAM</a><nav aria-label="Main navigation"><ul class="nav-menu"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="launches.html">Launches</a></li><li><a class="nav-link" href="statistics.html">Statistics</a></li><li><a class="nav-link" href="bookmarks.html">Bookmarks</a></li><li><a class="nav-link" href="compare.html">Compare</a></li><li><a class="nav-link" href="news.html">News</a></li></ul></nav></div></header><main id="main-content" class="pt-header"><section class="section"><div class="container"><div id="launch-detail"><div class="loading"><div class="loading-spinner"></div><p>Loading mission telemetry…</p></div></div></div></section></main><footer class="footer"><div class="container"><div class="footer-bottom"><p> © <span id="current-year">2026</span> Léonel Sandjong. MIT License.</p></div></div></footer><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/bookmarks.js"></script><script src="js/notifications.js"></script><script>const params=new URLSearchParams(location.search),id=params.get('id');async function load(){if(!id){document.getElementById('launch-detail').innerHTML='<p class="text-muted">No launch ID provided.</p>';return}const all=[...(await spaceAPI.getUpcomingLaunches(200)),...(await spaceAPI.getPastLaunches(200))];const launch=all.find(l=>l.id===id);if(!launch){document.getElementById('launch-detail').innerHTML='<p class="text-muted">Launch not found.</p>';return}const isFav=Bookmarks.has(id);const statusClass=launch.status==='Success'?'success':launch.status==='Failure'?'danger':launch.status==='Go'?'go':'warning';const countdown=launch.net?(()=>{const diff=new Date(launch.net)-Date.now();if(diff>0){const d=Math.floor(diff/864e5),h=Math.floor((diff%864e5)/36e5),m=Math.floor((diff%36e5)/6e4);return`T-${d}d ${h}h ${m}m`}return'Launched'})():'';document.getElementById('launch-detail').innerHTML=`<article class="card"><div class="card-header"><span class="card-badge ${statusClass}">${launch.statusName||launch.status}</span><span class="text-muted" style="font-family:var(--font-mono);font-size:.75rem">${spaceAPI.formatDateTime(launch.net)}</span></div><h1 style="font-size:1.5rem;margin:1rem 0">${launch.name||'Unknown Mission'}</h1><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:1.5rem 0"><div><div class="stat-label">Provider</div><div class="stat-value">${launch.provider||'N/A'}</div></div><div><div class="stat-label">Rocket</div><div class="stat-value">${launch.rocket||'N/A'}</div></div><div><div class="stat-label">Location</div><div class="stat-value">${launch.location||'N/A'}</div></div><div><div class="stat-label">Mission Type</div><div class="stat-value">${launch.missionType||'N/A'}</div></div>${countdown?`<div><div class="stat-label">Countdown</div><div class="stat-value">${countdown}</div></div>`:''}</div><div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.5rem"><button class="btn btn-primary" data-bookmark="${isFav?'remove':'add'}">${isFav?'★ Remove from Bookmarks':'☆ Add to Bookmarks'}</button><button class="btn btn-secondary" id="notify-btn">🔔 Notify Me</button><button class="btn btn-secondary" id="share-btn">🔗 Share</button><a class="btn btn-secondary" href="launches.html">← Back to Manifest</a></div></article>`;document.querySelector('[data-bookmark]').addEventListener('click',e=>{const action=e.target.dataset.bookmark;action==='add'?Bookmarks.add(id):Bookmarks.remove(id);load()});document.getElementById('notify-btn').addEventListener('click',async()=>{const perm=await Notifications.request();if(perm==='granted'){Notifications.show(launch.name,`Launch scheduled for ${spaceAPI.formatDateTime(launch.net)}`);e.target.textContent='✓ Enabled'}else{alert('Notifications permission denied or not supported.')}});document.getElementById('share-btn').addEventListener('click',()=>{navigator.clipboard.writeText(location.href).then(()=>alert('Link copied to clipboard!'))})}load().catch(console.error);</script></body></html>
