name: CI

'on':
  push:
    branches: [master, feat/*]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linting & Validation Tooling
        run: npm install -g htmlhint eslint

      - name: Lint HTML Structure
        run: htmlhint *.html

      - name: Lint JavaScript Files
        run: "npx --yes eslint@8 js/*.js --no-eslintrc --env browser,es2021 --rule 'no-undef: off'"
